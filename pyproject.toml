[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-healthcare-service"
version = "0.1.0"
description = "Public biomedical literature and traceable research evidence over MCP"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
aria-healthcare = "aria_healthcare.server:main"

[tool.setuptools.packages.find]
where = ["src"]
